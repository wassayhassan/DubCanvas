name: Quality runtime dependency resolution
on:
  pull_request:
jobs:
  resolve:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        role: [audio, translation, review, separator, torch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require native Apple Silicon runner
        run: python -c 'import platform; assert platform.machine() == "arm64", "Quality dependency checks require an ARM64 runner"'
      - name: Resolve isolated runtime without model downloads
        run: python -m pip install --dry-run --ignore-installed -r requirements-quality-${{ matrix.role }}.txt
