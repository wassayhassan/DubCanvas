name: Quality runtime dependency resolution
on:
  pull_request:
  push:
    branches: [main]
jobs:
  resolve:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: audio
            python: '3.13'
          - role: translation
            python: '3.13'
          - role: review
            python: '3.13'
          - role: separator
            python: '3.13'
          - role: torch
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Require native Apple Silicon runner
        run: python -c 'import platform; assert platform.machine() == "arm64", "Quality dependency checks require an ARM64 runner"'
      - name: Resolve isolated runtime without model downloads
        run: python -m pip install --dry-run --ignore-installed -r requirements-quality-${{ matrix.role }}.txt
      - name: Install and check native runtime
        run: |
          python -m pip install -r requirements-quality-${{ matrix.role }}.txt
          python -m pip check
      - name: Smoke-test APIs without model weights
        run: python tools/smoke_quality_runtime.py ${{ matrix.role }}
      - uses: actions/cache@v4
        if: matrix.role == 'separator'
        with:
          path: ~/Library/Caches/DubCanvas/checkpoint-multi.ckpt
          key: bandit-abcfccf65446752a057f4a302c941479a54b7560ebf8d7bca039d2ea98e64cfc
      - name: Verify official separation checkpoint with safe loading
        if: matrix.role == 'separator'
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import os
          import torch
          from tools.managed_setup import download_checkpoint
          path = Path.home() / 'Library/Caches/DubCanvas/checkpoint-multi.ckpt'
          path.parent.mkdir(parents=True, exist_ok=True)
          download_checkpoint(path)
          torch.load(path, map_location='cpu', weights_only=True)
          PYCODE
