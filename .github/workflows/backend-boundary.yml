name: Backend boundary tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  service-protocol-cli:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg for sync regression tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Source preflight
        run: python verify_source.py

      - name: Install small audio test dependencies
        run: |
          python -m pip install -c constraints.txt numpy soundfile opencv-python-headless
          python -m pip check

      - name: Resolve complete macOS backend and voice dependencies
        if: runner.os == 'macOS'
        run: python -m pip install --dry-run --ignore-installed -r requirements.txt -r requirements-cross-platform.txt -r requirements-premium-voices.txt

      - name: Test application service boundary
        run: python -m unittest discover -s tests -v

      - name: CLI help smoke test
        run: python -m dubcanvas --help

      - name: Backend hello smoke test
        shell: bash
        run: |
          printf '%s\n' '{"type":"request","id":"1","method":"hello","params":{}}' '{"type":"request","id":"2","method":"shutdown","params":{}}' |
          python -m anime_dubber.transport.stdio_server
