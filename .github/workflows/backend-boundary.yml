name: Backend boundary tests

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  service-protocol-cli:
    name: Python ${{ matrix.os }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg for sync regression tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rubberband-cli

      - name: Source preflight
        run: python verify_source.py

      - name: Install small audio test dependencies
        run: |
          python -m pip install -r requirements/dev.txt
          python -m pip check

      - name: Resolve complete macOS backend and voice dependencies
        if: runner.os == 'macOS' && matrix.python-version == '3.11'
        run: python -m pip install --dry-run --ignore-installed -r requirements.txt -r requirements-cross-platform.txt -r requirements-premium-voices.txt

      - name: Lint and check maintained module types
        run: |
          ruff check anime_dubber dubcanvas tools macos
          pyright
      - name: Test application service boundary and measure coverage
        run: |
          coverage run --source=anime_dubber -m unittest discover -s tests -v
          coverage report --skip-covered
          coverage xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml

      - name: CLI help smoke test
        run: python -m dubcanvas --help

      - name: Backend hello smoke test
        shell: bash
        run: |
          printf '%s\n' '{"type":"request","id":"1","method":"hello","params":{}}' '{"type":"request","id":"2","method":"shutdown","params":{}}' |
          python -m anime_dubber.transport.stdio_server
