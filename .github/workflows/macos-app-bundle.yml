name: macOS app bundle
permissions:
  contents: read
  actions: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  package:
    runs-on: macos-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Check installation target selection
        run: |
          zsh -n macos/package_app.sh
          target="$(zsh macos/package_app.sh --install-to "$RUNNER_TEMP/DubCanvas Test.app" --print-install-target | tail -1)"
          test "$target" = "$RUNNER_TEMP/DubCanvas Test.app"

      - name: Install packaging tools
        run: brew install uv ffmpeg rubberband espeak-ng deno

      - name: Build signed universal update bundle
        run: zsh macos/package_app.sh --no-embed-venv --universal --managed-tools

      - name: Validate bundle
        run: |
          test -x dist/DubCanvas.app/Contents/MacOS/DubCanvas
          test -f dist/DubCanvas.app/Contents/Info.plist
          test -f dist/DubCanvas.app/Contents/Resources/DubCanvas.icns
          test -f dist/DubCanvas.app/Contents/Resources/backend/anime_dubber/core.py
          test -f dist/DubCanvas.app/Contents/Resources/backend/dubcanvas/__main__.py
          test -f dist/DubCanvas.app/Contents/Resources/backend/tools/install_quality.py
          test -f dist/DubCanvas.app/Contents/Resources/backend/tools/managed_setup.py
          test -x dist/DubCanvas.app/Contents/Resources/tools/uv
          test -x dist/DubCanvas.app/Contents/Resources/tools/ffmpeg
          test -x dist/DubCanvas.app/Contents/Resources/tools/rubberband
          test -f dist/DubCanvas.app/Contents/Resources/backend/requirements-quality-audio.txt
          test -f dist/DubCanvas.app/Contents/Resources/backend/docs/quality-pipeline.md
          plutil -lint dist/DubCanvas.app/Contents/Info.plist
          test "$(plutil -extract CFBundleDisplayName raw dist/DubCanvas.app/Contents/Info.plist)" = "DubCanvas"
          test "$(plutil -extract DubCanvasSourceRevision raw dist/DubCanvas.app/Contents/Info.plist)" = "$GITHUB_SHA"
          lipo dist/DubCanvas.app/Contents/MacOS/DubCanvas -verify_arch arm64 x86_64
          codesign --verify --deep --strict dist/DubCanvas.app

      - name: Test managed first-install runtime without Homebrew Python
        run: |
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/managed-runtime/python"
          export UV_CACHE_DIR="$RUNNER_TEMP/managed-runtime/cache"
          export PHONEMIZER_ESPEAK_LIBRARY="$PWD/dist/DubCanvas.app/Contents/Resources/tools/lib/libespeak-ng.1.dylib"
          export ESPEAK_DATA_PATH="$PWD/dist/DubCanvas.app/Contents/Resources/tools/share/espeak-ng-data"
          export PYTHONPATH="$PWD/dist/DubCanvas.app/Contents/Resources/backend"
          export PATH="$PWD/dist/DubCanvas.app/Contents/Resources/tools:/usr/bin:/bin:/usr/sbin:/sbin"
          uv run --no-project --managed-python --python 3.13 python dist/DubCanvas.app/Contents/Resources/backend/tools/managed_setup.py --directory "$RUNNER_TEMP/managed-runtime" --uv "$PWD/dist/DubCanvas.app/Contents/Resources/tools/uv"
          test -f "$RUNNER_TEMP/managed-runtime/core-ready.json"
          "$RUNNER_TEMP/managed-runtime/core/bin/python" -c 'import kokoro, yt_dlp, anime_dubber.application'
          "$RUNNER_TEMP/managed-runtime/core/bin/python" - <<'PYCODE'
          import ctypes, os
          library = ctypes.CDLL(os.environ['PHONEMIZER_ESPEAK_LIBRARY'])
          library.espeak_Initialize.argtypes = [ctypes.c_int, ctypes.c_int, ctypes.c_char_p, ctypes.c_int]
          assert library.espeak_Initialize(2, 0, os.environ['ESPEAK_DATA_PATH'].encode(), 0) > 0
          PYCODE

      - name: Test update verification and staging
        run: swift test --package-path macos/DubCanvasApp

      - uses: actions/upload-artifact@v4
        with:
          name: DubCanvas-macOS-lightweight
          path: dist/DubCanvas.app

      - name: Publish automatic update after other checks pass
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 macos/publish_update.py
